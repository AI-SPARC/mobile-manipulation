type: package

# Configuração dos construtores de documentação
builders:
  - type: doxygen
    name: html_docs
    # O diretório onde está o código fonte (relativo ao rosdoc2.yaml)
    source_dir: .
    # O nome do arquivo de configuração do Doxygen que você forneceu
    doxyfile: Doxyfile
    # Opção para não rodar o javavadoc (focado em C++)
    no_javasphinx: true