# Configuração para o ros2_control (Isaac Sim)
# Define os *tipos* dos controladores
controller_manager:
  ros__parameters:
    update_rate: 1000 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

panda_arm_controller:
  ros__parameters:
   
    allow_partial_joints_goal: true 

    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      - panda_finger_joint1 
      - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_state_broadcaster:
  ros__parameters:
    {}
