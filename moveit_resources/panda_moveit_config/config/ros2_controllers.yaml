# Configuração para o ros2_control (Isaac Sim)
# Define os *tipos* dos controladores
controller_manager:
  ros__parameters:
    update_rate: 100 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Define os *parâmetros* para o panda_arm_controller
# Este é o ÚNICO controlador, com todas as 8 juntas.
panda_arm_controller:
  ros__parameters:
    # [A SOLUÇÃO ESTÁ AQUI]
    # Permite que o MoveIt envie trajetórias parciais (ex: só as 7 juntas do braço)
    # para este controlador que gerencia 8 juntas.
    allow_partial_joints_goal: true 

    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      - panda_finger_joint1 # Garra incluída
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Parâmetros para o joint_state_broadcaster (vazio é ok)
joint_state_broadcaster:
  ros__parameters:
    {}
