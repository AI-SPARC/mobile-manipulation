# =========================================================
# CONFIGURAÇÃO CENTRALIZADA DO SISTEMA
# =========================================================

# ---------------------------------------------------------
# 1. NAVEGAÇÃO (Nós executáveis independentes)
# ---------------------------------------------------------
a_star:
  ros__parameters:
    path_resolution: 0.05
    security_distance: 0.4
    iterations_before_verification: 20
    use_sim_time: true

controller:
  ros__parameters:
    use_sim_time: true

# ---------------------------------------------------------
# 2. MANIPULAÇÃO (Nós executáveis independentes)
# ---------------------------------------------------------
manipulation:
  ros__parameters:
    use_sim_time: true
    # 'yaml_file' (pick_place) será injetado pelo Launch (Python)
    pick_place_filename: "pick_and_place_poses.yaml"

add_collision:
  ros__parameters:
    use_sim_time: true
    # 'yaml_file' (labels) será injetado pelo Launch (Python)
    labels_filename: "labels.yaml"

# ---------------------------------------------------------
# 3. SERVER NODE (Container dos Composable Nodes)
# ---------------------------------------------------------
server_node:
  ros__parameters:
    use_sim_time: true
    
    # Arquivo da Behavior Tree
    bt_xml_filename: "store_boxes.xml" 
    
    # -----------------------------------------------------
    # 3.1. Nó Interno: STORAGE NODE
    # Mapeado no C++ como: "__node:=storage_node"
    # -----------------------------------------------------
    storage_node:
      ros__parameters:
        use_sim_time: true
        # O Launch (Python) deve ler estes nomes, resolver o caminho completo
        # e injetar nas chaves 'label_to_storage_yaml_file' e 'storage_poses_yaml_file'
        label_to_storage_filename: "labels_to_storage.yaml"
        storage_poses_filename: "storages.yaml"

    # -----------------------------------------------------
    # 3.2. Nó Interno: SHARED OBSTACLE GRAPH
    # Mapeado no C++ como: "__node:=shared_obstacle_graph_node"
    # -----------------------------------------------------
    shared_obstacle_graph_node:
      ros__parameters:
        use_sim_time: true
        map_yaml_filename: "multiple_storages.yaml"
        map_image_filename: "multiple_storages.png"
        
        max_security_distance: 0.45
        obstacle_graph_resolution: 0.05
        publish_frequency: 1.0

    # -----------------------------------------------------
    # 3.3. Nó Interno: REACHABILITY NODE
    # Mapeado no C++ como: "__node:=reachability_node"
    # -----------------------------------------------------
    reachability_node:
      ros__parameters:
        path_resolution: 0.05
        use_sim_time: true
       

    # -----------------------------------------------------
    # 3.4. Nó Interno: GRIPPER MONITOR NODE
    # Mapeado no C++ como: "__node:=gripper_monitor_node"
    # -----------------------------------------------------
    gripper_monitor_node:
      ros__parameters:
        use_sim_time: true
        # Adicione parâmetros de gripper aqui se houver

    # -----------------------------------------------------
    # 3.5. Nó Interno: ORGANIZE NODE
    # Mapeado no C++ como: "__node:=organize_node"
    # -----------------------------------------------------
    organize_node:
      ros__parameters:
        use_sim_time: true
        # Adicione parâmetros de organize aqui se houver